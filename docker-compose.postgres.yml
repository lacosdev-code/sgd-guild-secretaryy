version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sgd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guild_secretary
    ports:
      - "127.0.0.1:5433:5432"   # hanya expose ke localhost (aman)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guild_secretary"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
