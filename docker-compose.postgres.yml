version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sgd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgd_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ganti_password_kuat_ini}
      POSTGRES_DB: sgd_db
    ports:
      - "127.0.0.1:5432:5432"   # hanya expose ke localhost (aman)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgd_user -d sgd_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
